# Settings shared by both languages of the documentation site, built with Zensical
# (https://zensical.org), which reads this MkDocs format. mkdocs.yml (English, the
# source) and mkdocs.de.yml (German, built into site/de/) inherit this file. INHERIT
# appends lists instead of replacing them, so lists that differ per language (nav,
# palette) live only in the language files. Build both with `scripts/docs build`.
site_name: Klimamessnetz Mannheim
site_description: Home Assistant integration for the Smart City Mannheim urban climate network
repo_url: https://github.com/CodeBrauer/ha-mannheim-climate
repo_name: CodeBrauer/ha-mannheim-climate

# Each language links its folder of docs/screenshots/ (shared with the READMEs,
# generated by scripts/screenshots.py), docs/assets/ (stylesheet) and the brand icon of
# the integration. Zensical only follows symlinks into watched folders, and not a
# symlink inside a linked folder.
watch:
  - docs/screenshots
  - docs/assets
  - custom_components/mannheim_climate/brand

extra_css:
  - assets/extra.css

theme:
  name: material
  logo: brand/icon@2x.png
  favicon: brand/icon.png
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight

# Click an image to enlarge it (built into Zensical). Listing plugins replaces the
# defaults, so search is listed too.
plugins:
  - search
  - glightbox:
      auto_caption: true

extra:
  alternate:
    - name: English
      link: /ha-mannheim-climate/
      lang: en
    - name: Deutsch
      link: /ha-mannheim-climate/de/
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
