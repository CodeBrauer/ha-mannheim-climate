# Documentation site, built with Zensical (https://zensical.org), which reads this
# MkDocs format. English is the source; mkdocs.de.yml inherits this file and builds
# the German translation into site/de/. Build both with `scripts/docs build`.
site_name: Klimamessnetz Mannheim
site_description: Home Assistant integration for the Smart City Mannheim urban climate network
site_url: https://codebrauer.github.io/ha-mannheim-climate/
repo_url: https://github.com/CodeBrauer/ha-mannheim-climate
repo_name: CodeBrauer/ha-mannheim-climate
edit_uri: edit/main/docs/en/
copyright: Unofficial project, not affiliated with Smart City Mannheim GmbH or the city of Mannheim.

docs_dir: docs/en
site_dir: site
# Both languages link docs/screenshots (shared with the READMEs); Zensical only
# follows symlinks into watched folders.
watch:
  - docs/screenshots

nav:
  - index.md
  - User guide:
      - user/installation.md
      - user/setup.md
      - user/entities.md
      - user/stations.md
      - user/api-limits.md
      - user/troubleshooting.md
  - Developer guide:
      - developer/architecture.md
      - developer/data-flow.md
      - developer/aggregation.md
      - developer/reference-data.md
      - developer/contributing.md
  - data-sources.md

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/sun
        name: Switch to light mode

extra:
  alternate:
    - name: English
      link: /ha-mannheim-climate/
      lang: en
    - name: Deutsch
      link: /ha-mannheim-climate/de/
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
