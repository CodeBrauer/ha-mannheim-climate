name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  zip:
    name: Attach integration ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # HACS extracts the ZIP into custom_components/mannheim_climate (hacs.json).
      - name: Build the ZIP
        working-directory: custom_components/mannheim_climate
        run: zip -r "$RUNNER_TEMP/mannheim_climate.zip" .

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/mannheim_climate.zip" --clobber --repo "$GITHUB_REPOSITORY"
