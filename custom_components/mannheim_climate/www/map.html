<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Klimamessnetz Mannheim</title>
  <link rel="stylesheet" href="__STATIC__/leaflet/leaflet.css?v=__VERSION__">
  <link rel="stylesheet" href="__STATIC__/map.css?v=__VERSION__">
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <aside id="panel">
      <h1 id="title"></h1>
      <p id="recommendation"></p>
      <p id="hint" class="muted"></p>
      <div id="counter"></div>
      <ol id="selected"></ol>
      <label for="wind" id="wind-label"></label>
      <select id="wind"></select>
      <p id="budget" class="muted"></p>
      <ul id="legend"></ul>
      <button id="submit" type="button"></button>
      <p id="status" role="status"></p>
    </aside>
  </div>
  <script type="application/json" id="config">__CONFIG__</script>
  <script src="__STATIC__/leaflet/leaflet.js?v=__VERSION__"></script>
  <script src="__STATIC__/map.js?v=__VERSION__"></script>
</body>
</html>
